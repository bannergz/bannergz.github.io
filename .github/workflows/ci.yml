# Gate for pull requests.
#
# deploy.yml runs lint/test/build only on push to main — that is, AFTER the
# merge. Anything that breaks the build therefore merged "green" (there was
# nothing to turn red) and took the site's deploy down with it. This runs the
# same three steps on the PR instead, on the same Node version deploy.yml
# uses, so the gate predicts the deploy rather than reporting on it.
name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Catches what lint and test cannot: this repo builds with
      # `output: "export"`, which rejects route handlers that are not
      # explicitly static. That failure surfaces only here.
      - name: Build
        run: npm run build
